services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [backend]
